<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="EngFlow 2.0 — Aprende inglés pensando y hablando desde el día uno. Funciona sin conexión." />
  <meta name="theme-color" content="#0F9D58" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="src/assets/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EngFlow" />
  <title>EngFlow – Aprende Inglés</title>
  <link rel="stylesheet" href="src/css/styles.css" />
</head>
<body>
  <!-- App shell -->
  <div id="app" class="app" data-theme="light">

    <!-- Desktop sidebar rail -->
    <aside class="sidebar" aria-label="Navegación principal">
      <div class="brand">
        <span class="brand__logo" aria-hidden="true">E</span>
        <div>
          <div class="brand__name">EngFlow</div>
          <div class="brand__tag">Studio 2.0</div>
        </div>
      </div>
      <nav class="nav nav--side">
        <a href="#/home" class="nav__item" data-route="home"><span class="nav__icon">🎯</span><span data-i18n="nav.today">Hoy</span></a>
        <a href="#/practice" class="nav__item" data-route="practice"><span class="nav__icon">🎙️</span><span data-i18n="nav.practice">Practicar</span></a>
        <a href="#/notebook" class="nav__item" data-route="notebook"><span class="nav__icon">📓</span><span data-i18n="nav.notebook">Cuaderno</span></a>
        <a href="#/profile" class="nav__item" data-route="profile"><span class="nav__icon">👤</span><span data-i18n="nav.profile">Perfil</span></a>
      </nav>
    </aside>

    <main id="view" class="view" role="main">
      <!-- Screens are injected here by the router -->
    </main>

    <!-- Mobile frosted-glass bottom navigation -->
    <nav class="nav nav--bottom" aria-label="Navegación inferior">
      <a href="#/home" class="nav__item" data-route="home"><span class="nav__icon">🎯</span><span data-i18n="nav.today">Hoy</span></a>
      <a href="#/practice" class="nav__item" data-route="practice"><span class="nav__icon">🎙️</span><span data-i18n="nav.practice">Practicar</span></a>
      <a href="#/notebook" class="nav__item" data-route="notebook"><span class="nav__icon">📓</span><span data-i18n="nav.notebook">Cuaderno</span></a>
      <a href="#/profile" class="nav__item" data-route="profile"><span class="nav__icon">👤</span><span data-i18n="nav.profile">Perfil</span></a>
    </nav>
  </div>

  <!-- Offline status indicator -->
  <div id="net-status" class="net-status" hidden role="status">📴 <span data-i18n="net.offline">Sin conexión</span></div>

  <!-- Toast / notifications -->
  <div id="toast" class="toast" role="status" aria-live="assertive"></div>

  <!-- Install prompt banner -->
  <div id="install-banner" class="install-banner" hidden>
    <span data-i18n="install.text">Instala EngFlow en tu dispositivo</span>
    <button id="install-btn" class="btn btn--small" data-i18n="install.button">Instalar</button>
    <button id="install-dismiss" class="btn btn--ghost btn--small" aria-label="Cerrar">✕</button>
  </div>

  <script type="module" src="src/js/app.js"></script>
</body>
</html>
