<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <title>Sin conexión – EngFlow</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:#0f172a;color:#e2e8f0;text-align:center;padding:24px}
    .card{max-width:420px}
    .logo{width:84px;height:84px;border-radius:20px;margin:0 auto 20px;
      background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;
      align-items:center;justify-content:center;font-size:42px;font-weight:800;color:#fff}
    h1{font-size:22px;margin:0 0 8px}
    p{color:#94a3b8;line-height:1.5}
    button{margin-top:20px;background:#2563eb;color:#fff;border:0;border-radius:12px;
      padding:12px 24px;font-size:16px;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">E</div>
    <h1>Estás sin conexión</h1>
    <p>No pudimos cargar esta parte ahora mismo. El contenido ya descargado sigue disponible. Revisa tu conexión e inténtalo de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
